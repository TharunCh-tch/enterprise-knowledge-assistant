[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises real HuggingFace models + FAISS (slower, may download weights on first run)",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [".venv", "data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
